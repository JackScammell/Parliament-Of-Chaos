# Parliament of Chaos — Command Manifest
#
# Declarative registry of every slash command shipped by the plugin. This is the
# source of truth that `/parliament-doctor` reconciles against `commands/*.md`
# files and the live skill registry. If a command file exists but is not listed
# here, it is a "ghost". If it is listed here but no file exists, it is missing.
#
# Fields per entry:
#   name           — slash command name (no leading slash, must match filename)
#   status         — active | deprecated | experimental | orphaned
#   owner          — primary agent or subsystem responsible
#   skill_surface  — true if the command should appear in the `/chaos:` skill list
#   effort         — must match the effort declared in the command's frontmatter
#   category       — grouping used by /list-commands
#   notes          — optional free-text annotations
#
# Maintenance:
#   • Update this file whenever a command is added, renamed, retired, or its
#     surface visibility changes.
#   • Run `/parliament-doctor` before cutting a release to confirm zero drift.
#   • Orphan entries should be resolved (exposed or retired) during Tier 1 of
#     the toolset-gaps plan — see .project-files/toolset-gaps-debate.md.

